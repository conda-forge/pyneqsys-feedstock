schema_version: 1

context:
  name: pyneqsys
  version: "0.5.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyneqsys-${{ version }}.tar.gz
  sha256: a4ef31b66895171ecab9677d2f36c757debafad450169a2ba0d4e23a7eff283a

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - matplotlib-base
    - numpy >1.7
    - python >=${{ python_min }}
    - scipy
    - sym >=0.3.1
    - sympy >=1.3

tests:
  - python:
      imports:
        - pyneqsys
        - pyneqsys.tests
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Package for numerically solving symbolically defined systems of non-linear equations.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://github.com/bjodah/pyneqsys

extra:
  recipe-maintainers:
    - ProfLeao
    - bjodah
    - jan-janssen
